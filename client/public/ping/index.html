<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nút Vô Tri</title>
  <meta name="description" content="4 cái nút. Bấm đi." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/ping/manifest.json" />
  <link rel="apple-touch-icon" href="/images/chatdvt_avatar.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nút Vô Tri" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      height:100%;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      background:#0a0a0a;
      overflow:hidden;
      user-select:none;
      -webkit-user-select:none;
    }
    body{
      display:flex;
      flex-direction:column;
      min-height:100dvh;
      padding:env(safe-area-inset-top,12px) 10px env(safe-area-inset-bottom,12px) 10px;
    }

    .grid{
      flex:1;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1fr 1fr;
      gap:10px;
      max-width:420px;
      width:100%;
      margin:0 auto;
    }

    .card{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      border-radius:24px;
      border:none;
      cursor:pointer;
      overflow:hidden;
      -webkit-appearance:none;
      appearance:none;
      outline:none;
      transition:transform 0.15s ease,filter 0.15s ease;
    }

    .card:active{transform:scale(0.93)}

    .card .bg{
      position:absolute;inset:0;
      transition:opacity 0.3s;
      z-index:0;
    }

    .card[data-id="hungry"] .bg{
      background:linear-gradient(145deg,#1a0f00 0%,#2d1600 30%,#4a2000 100%);
    }
    .card[data-id="angry"] .bg{
      background:linear-gradient(145deg,#1a0005 0%,#2d000a 30%,#4a0012 100%);
    }
    .card[data-id="shutdown"] .bg{
      background:linear-gradient(145deg,#0a0a12 0%,#0d0d1a 30%,#111128 100%);
    }
    .card[data-id="summon"] .bg{
      background:linear-gradient(145deg,#0a1205 0%,#0d1a08 30%,#1a2d10 100%);
    }

    .card .glow{
      position:absolute;
      width:140%;height:140%;
      top:-20%;left:-20%;
      border-radius:50%;
      filter:blur(60px);
      opacity:0.15;
      z-index:0;
      transition:opacity 0.3s;
    }

    .card:active .glow{opacity:0.35}

    .card[data-id="hungry"] .glow{background:#f97316}
    .card[data-id="angry"] .glow{background:#ef4444}
    .card[data-id="shutdown"] .glow{background:#6366f1}
    .card[data-id="summon"] .glow{background:#22c55e}

    .card .emoji{
      font-size:56px;
      line-height:1;
      z-index:1;
      filter:drop-shadow(0 4px 20px rgba(0,0,0,0.5));
      transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }

    .card:active .emoji{transform:scale(1.25) rotate(-6deg)}

    .card .label{
      font-size:11px;
      font-weight:800;
      letter-spacing:2.5px;
      text-transform:uppercase;
      z-index:1;
      opacity:0.9;
    }

    .card .sublabel{
      font-size:9px;
      font-weight:500;
      letter-spacing:1px;
      z-index:1;
      opacity:0.35;
      text-transform:uppercase;
    }

    .card[data-id="hungry"] .label{color:#fb923c}
    .card[data-id="angry"] .label{color:#f87171}
    .card[data-id="shutdown"] .label{color:#a5b4fc}
    .card[data-id="summon"] .label{color:#86efac}

    .card[data-id="hungry"] .sublabel{color:#fb923c}
    .card[data-id="angry"] .sublabel{color:#f87171}
    .card[data-id="shutdown"] .sublabel{color:#a5b4fc}
    .card[data-id="summon"] .sublabel{color:#86efac}

    .card.sending{pointer-events:none;filter:brightness(0.5)}
    .card.sent .emoji{animation:pop 0.4s ease}
    .card.cooldown{pointer-events:none}

    .cooldown-ring{
      position:absolute;
      top:10px;right:10px;
      width:28px;height:28px;
      z-index:2;
    }

    .cooldown-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
    .cooldown-ring circle{
      fill:none;
      stroke-width:3;
      stroke-linecap:round;
    }
    .cooldown-ring .track{stroke:rgba(255,255,255,0.06)}
    .cooldown-ring .progress{
      stroke:rgba(255,255,255,0.3);
      stroke-dasharray:78.5;
      stroke-dashoffset:0;
      transition:none;
    }

    .toast{
      position:fixed;
      bottom:max(30px,env(safe-area-inset-bottom,30px));
      left:50%;
      transform:translateX(-50%) translateY(80px);
      padding:12px 22px;
      border-radius:100px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.5px;
      z-index:999;
      opacity:0;
      transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.ok{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.25);color:#4ade80}
    .toast.err{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);color:#f87171}

    .ripple{
      position:absolute;
      border-radius:50%;
      transform:scale(0);
      animation:rippleAnim 0.6s ease-out;
      pointer-events:none;
      z-index:1;
    }
    .card[data-id="hungry"] .ripple{background:rgba(249,115,22,0.15)}
    .card[data-id="angry"] .ripple{background:rgba(239,68,68,0.15)}
    .card[data-id="shutdown"] .ripple{background:rgba(99,102,241,0.15)}
    .card[data-id="summon"] .ripple{background:rgba(34,197,94,0.15)}

    @keyframes rippleAnim{to{transform:scale(5);opacity:0}}
    @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(8deg)}60%{transform:scale(0.9)}100%{transform:scale(1)}}

    @media(max-height:600px){
      .card .emoji{font-size:40px}
      .card .label{font-size:10px}
      .card .sublabel{display:none}
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <div class="toast" id="toast"></div>

  <script>
    var DATA = [
      {id:'hungry', emoji:'🍕', label:'Đói mờ mắt', sub:'Cấp cứu đồ ăn'},
      {id:'angry',  emoji:'🤬', label:'Đang quạu',  sub:'Cấm chọc'},
      {id:'shutdown',emoji:'🪫', label:'Sập nguồn', sub:'Cấm làm phiền'},
      {id:'summon', emoji:'🧞‍♂️', label:'Triệu hồi', sub:'Xuất hiện ngay'}
    ];

    var COOLDOWN = 10000;
    var locks = {};
    var grid = document.getElementById('grid');
    var toastEl = document.getElementById('toast');
    var toastT = null;

    DATA.forEach(function(d) {
      var btn = document.createElement('button');
      btn.className = 'card';
      btn.setAttribute('data-id', d.id);
      btn.innerHTML =
        '<div class="bg"></div>' +
        '<div class="glow"></div>' +
        '<span class="emoji">' + d.emoji + '</span>' +
        '<span class="label">' + d.label + '</span>' +
        '<span class="sublabel">' + d.sub + '</span>';

      btn.addEventListener('click', function(e) { fire(d.id, btn, e); });
      grid.appendChild(btn);
    });

    function fire(id, el, ev) {
      if (locks[id]) return;

      var rect = el.getBoundingClientRect();
      var rip = document.createElement('span');
      rip.className = 'ripple';
      var sz = Math.max(rect.width, rect.height) * 2;
      rip.style.width = sz + 'px';
      rip.style.height = sz + 'px';
      rip.style.left = ((ev.clientX || ev.touches[0].clientX) - rect.left - sz/2) + 'px';
      rip.style.top = ((ev.clientY || ev.touches[0].clientY) - rect.top - sz/2) + 'px';
      el.appendChild(rip);
      setTimeout(function(){rip.remove()},600);

      el.classList.add('sending');
      locks[id] = true;

      fetch('/api/ping-sos', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({buttonId:id})
      })
      .then(function(r){return r.json()})
      .then(function(data){
        el.classList.remove('sending');
        if (data.ok) {
          el.classList.add('sent','cooldown');
          toast('Đã gửi ✓','ok');
          startCooldown(id, el);
        } else {
          locks[id] = false;
          toast(data.error || 'Lỗi','err');
        }
      })
      .catch(function(){
        el.classList.remove('sending');
        locks[id] = false;
        toast('Mất kết nối','err');
      });
    }

    function startCooldown(id, el) {
      var ring = document.createElement('div');
      ring.className = 'cooldown-ring';
      ring.innerHTML = '<svg viewBox="0 0 28 28"><circle class="track" cx="14" cy="14" r="12.5"/><circle class="progress" cx="14" cy="14" r="12.5"/></svg>';
      el.appendChild(ring);

      var prog = ring.querySelector('.progress');
      var circum = 78.5;
      var start = Date.now();

      function tick() {
        var elapsed = Date.now() - start;
        var pct = Math.min(elapsed / COOLDOWN, 1);
        prog.style.strokeDashoffset = (circum * pct).toString();
        if (pct < 1) requestAnimationFrame(tick);
        else {
          ring.remove();
          el.classList.remove('sent','cooldown');
          locks[id] = false;
        }
      }
      requestAnimationFrame(tick);
    }

    function toast(msg, type) {
      toastEl.textContent = msg;
      toastEl.className = 'toast ' + type;
      requestAnimationFrame(function(){toastEl.classList.add('show')});
      clearTimeout(toastT);
      toastT = setTimeout(function(){toastEl.classList.remove('show')},2500);
    }
  </script>
</body>
</html>
