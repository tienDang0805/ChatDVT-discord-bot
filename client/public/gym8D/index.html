<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <script>
    if (typeof window !== 'undefined' && /^\/gym8d(\/|$)/i.test(window.location.pathname)) {
      document.write('<base href="/gym8D/" />');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gấu Gym 8D" />
  <meta name="theme-color" content="#FAF5EA" />
  <title>Gấu Tập Gym 8D — Lịch Tập, Bài Tập Ưu Tiên & Dinh Dưỡng Khoa Học</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FAF5EA !important;
      color: #2B2118;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      min-height: 100%;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FAF5EA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      transition: opacity 0.28s ease;
    }
    .splash-card {
      width: 100%;
      max-width: 356px;
      background: #FFFDF9;
      border: 2.5px solid #2B2118;
      border-radius: 22px;
      box-shadow: 0 5px 0 #2B2118;
      padding: 22px 18px 20px;
      text-align: center;
    }
    .splash-logo {
      width: 82px;
      height: 82px;
      border-radius: 20px;
      border: 2.5px solid #2B2118;
      background: #FAF5EA;
      object-fit: cover;
      animation: splashFloat 1.5s ease-in-out infinite alternate;
    }
    .splash-bar-track {
      margin-top: 14px;
      width: 100%;
      height: 11px;
      background: #EDE1CE;
      border: 2px solid #2B2118;
      border-radius: 999px;
      overflow: hidden;
    }
    .splash-bar-fill {
      height: 100%;
      width: 65%;
      background: linear-gradient(90deg, #E05A2B 0%, #F59E0B 50%, #16A34A 100%);
      border-radius: 999px;
      animation: splashLoad 1.1s ease-in-out infinite alternate;
    }
    @keyframes splashFloat {
      from { transform: translateY(0px) scale(1); }
      to { transform: translateY(-5px) scale(1.03); }
    }
    @keyframes splashLoad {
      from { width: 32%; }
      to { width: 94%; }
    }
  </style>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/mascots/app_icon_sherpa_512.png" />
  <link rel="icon" type="image/png" href="./assets/mascots/app_icon_sherpa_512.png" />
  <link rel="stylesheet" href="./styles.css?v=18" />
  <script defer src="./src/vendor-react.js?v=18"></script>
  <script defer src="./src/gym-core.js?v=18"></script>
  <script defer src="./src/gym-app.js?v=18"></script>
</head>
<body>
  <div id="app-splash" aria-label="Đang mở ứng dụng Gấu Gym 8D">
    <div class="splash-card">
      <img src="./assets/mascots/app_icon_sherpa_512.png" alt="Gấu Gym 8D" class="splash-logo" />
      <div style="margin-top: 10px;">
        <span style="display:inline-block;padding:3px 10px;border-radius:999px;background:#FFEDD5;border:1.5px solid #2B2118;color:#9A3412;font-size:10.5px;font-weight:900;">
          GẤU GYM 8D · TRỢ LÝ TẬP &amp; DINH DƯỠNG
        </span>
      </div>
      <div style="font-size:19px;font-weight:900;color:#2B2118;margin-top:8px;">
        Đang tải Giáo Án &amp; Lịch Tập...
      </div>
      <div style="font-size:12px;font-weight:700;color:#6B5744;margin-top:4px;line-height:1.4;">
        Đồng bộ 44 máy tập TNG UVK &amp; Ways QL13 · Thực đơn 42 món Việt
      </div>
      <div class="splash-bar-track">
        <div class="splash-bar-fill"></div>
      </div>
    </div>
  </div>
  <div id="root"></div>

  
</body>
</html>
